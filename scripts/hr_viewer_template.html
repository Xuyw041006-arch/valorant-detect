<!doctype html><html lang="{{lang}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#f0f5fa;font:14px/1.5 system-ui,sans-serif}main{max-width:1510px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 5px;letter-spacing:.2px}a{color:#88e8cf;text-decoration:none}a:hover{text-decoration:underline}.language{float:right;padding:8px}.subtitle{margin:0;color:#9cb2c5;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;margin-top:20px}.stage{position:sticky;top:16px;align-self:start}video{display:block;width:100%;background:#05090d;border-radius:10px}.toolbar{display:flex;align-items:center;gap:8px;margin:12px 0}button,select{background:#1b2d40;border:1px solid #395066;color:#eff7ff;border-radius:7px;padding:9px;cursor:pointer;font:inherit}button:hover{background:#29475d}button.mode.active{background:#31564f;border-color:#77dcc3}#clock{margin-left:auto;color:#8ce3d0;font-variant-numeric:tabular-nums}.card{background:#152334;border:1px solid #2a4156;border-radius:10px;padding:14px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:#a9bdcf;font-size:12px;margin-bottom:5px}select{width:100%;font-size:12px}#count{font-size:12px;color:#8dddc9;margin:12px 0}#events{height:345px;overflow:auto;padding:2px}.event{display:block;width:100%;text-align:left;margin:0 0 7px;border-left:3px solid var(--color);line-height:1.5;font-size:13px}.event.active{outline:2px solid #83e3cb;background:#264b51}.stamp{color:#8ce3d0;font-variant-numeric:tabular-nums}.subtag{display:block;font-size:11px;color:#a6bdd0;margin-top:3px}.detail{margin-top:14px}h2{font-size:15px;margin:0 0 8px}.description{font-size:14px;margin:0 0 10px;line-height:1.7}.status{font-size:12px;color:#8ce3d0}.markers{position:relative;height:32px;margin:0 6px;background:linear-gradient(transparent 47%,#40556b 47%,#40556b 53%,transparent 53%)}.marker{position:absolute;top:7px;width:8px;height:19px;padding:0;border:0;background:var(--color);transform:translateX(-50%);border-radius:3px}.marker.active{outline:2px solid white;z-index:4}.head{position:absolute;top:0;bottom:0;width:2px;background:white;pointer-events:none}.range{width:100%;accent-color:#88e8cf}.ticks{display:flex;justify-content:space-between;color:#9cb2c5;font-size:11px}.hint{font-size:12px;color:#99b0c4;margin:10px 0 0}.links{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:15px}details{margin-top:14px;font-size:12px;color:#aabed0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#09131e;color:#dce8f1;font:11px/1.5 ui-monospace,monospace;border-radius:6px;padding:12px}footer{margin-top:18px;font-size:11px;color:#7f99ad}@media(max-width:980px){.workspace{grid-template-columns:1fr}.stage{position:static}#events{height:270px}}@media(max-width:580px){main{padding:12px}h1{font-size:22px}.language{float:none;display:block;padding-left:0}.filters{grid-template-columns:1fr}}
.gallery-section{margin-top:28px;padding:20px}.gallery-section h2{font-size:20px}.gallery-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.gallery-tabs button{font-size:12px}.gallery-tabs button[aria-pressed="true"]{background:#31564f;border-color:#88e8cf}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1060px;margin:auto}.comparison figure{margin:0;min-width:0}.comparison img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #354b5e}.comparison figcaption{font-size:12px;color:#b6c9d9;margin-bottom:7px}.gallery-caption{margin:14px 0 0;color:#b6c9d9;font-size:13px}.gallery-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.gallery-intro{max-width:1060px;margin:8px 0;color:#b6c9d9;font-size:14px;line-height:1.75}@media(max-width:580px){.gallery-section{padding:12px}.comparison{gap:8px}.gallery-tabs button{font-size:11px;padding:7px}}
</style><main><a id="language" class="language" href="{{other}}">{{language_link}}</a><h1>{{title}}</h1><p class="subtitle"><span>{{subtitle}}</span><span aria-hidden="true"> · </span><a id="videoEvaluation" href="{{report_url}}">{{video_report}}</a></p><div class="workspace"><section class="stage"><video id="video" controls preload="metadata" src="{{video}}"></video><div class="toolbar"><button id="predicted" class="mode active">{{predicted}}</button><button id="clean" class="mode">{{clean}}</button><span id="clock">00:00.0 / 01:19.9</span></div><div class="card"><div id="markers" class="markers"></div><input id="scrub" class="range" aria-label="{{timeline}}" type="range" min="0" max="79.866667" step="0.033333" value="0"><div class="ticks"><span>00:00</span><span>00:20</span><span>00:40</span><span>01:00</span><span>01:19.9</span></div><p class="hint">{{hint}}</p></div><div class="links"><a href="{{video}}" download>{{download}}</a><a href="events.json" download>{{jsondownload}}</a></div><footer>{{selection_note}}</footer></section><aside><section class="card"><div class="filters"><div><label for="mainFilter">{{category}}</label><select id="mainFilter"></select></div><div><label for="subFilter">{{subtype}}</label><select id="subFilter"></select></div></div><p id="count"></p><div id="events"></div></section><section class="card detail"><h2>{{selected}}</h2><p id="description" class="description">{{empty}}</p><span id="status" class="status"></span><details><summary>{{event_record}}</summary><pre id="json">{}</pre></details></section></aside></div><section id="skills" class="card gallery-section" aria-labelledby="galleryTitle"><div class="gallery-heading"><h2 id="galleryTitle">{{gallery_title}}</h2></div><p id="galleryIntro" class="gallery-intro">{{gallery_intro}}</p><p class="hint">{{gallery_hint}}</p><div id="galleryTabs" class="gallery-tabs" aria-label="{{gallery_title}}"></div><h3 id="skillTitle"></h3><div class="comparison"><figure><figcaption>{{gt_title}}</figcaption><a id="gtLink" target="_blank" rel="noopener"><img id="gtImage" width="640" height="640" alt="{{gt_title}}"></a></figure><figure><figcaption>{{pred_title}}</figcaption><a id="predLink" target="_blank" rel="noopener"><img id="predImage" width="640" height="640" alt="{{pred_title}}"></a></figure></div><p id="skillCaption" class="gallery-caption"></p></section></main>
<script>
const DATA=__DATA__,META=__META__,T=META.text,q=id=>document.getElementById(id),v=q('video'),DURATION=META.duration,COLORS={person_appeared:'#75dcb2',person_disappeared:'#f2949d',object_detected:'#e3bb77',state_changed:'#89b8fa'};let selected=null,pending=null,pauseAfterSeek=false;const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`;
// Expose the actually presented media frame for deterministic replay checks.
if(v.requestVideoFrameCallback){const observeFrame=(now,metadata)=>{v.dataset.presentedFrame=Math.round(metadata.mediaTime*30);v.requestVideoFrameCallback(observeFrame)};v.requestVideoFrameCallback(observeFrame)}
function addOption(p,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;p.append(o)}
addOption(q('mainFilter'),'all',T.all);META.mains.forEach(c=>addOption(q('mainFilter'),c.id,c.name));
function subs(){const m=q('mainFilter').value;q('subFilter').replaceChildren();addOption(q('subFilter'),'all',T.all);META.subs.filter(s=>m==='all'||s.main===m).forEach(s=>addOption(q('subFilter'),s.id,s.name))}
function filtered(){return DATA.filter(d=>(q('mainFilter').value==='all'||d.event.event===q('mainFilter').value)&&(q('subFilter').value==='all'||d.sub===q('subFilter').value))}
function sync(){const t=v.currentTime||0;q('clock').textContent=fmt(t)+' / '+fmt(DURATION);q('scrub').value=t;if(q('head'))q('head').style.left=(t/DURATION*100)+'%';if(selected!==null)q('status').textContent=fmt(DATA[selected].event.timestamp)+' · '+(v.paused?T.paused:T.playing)}
function seekPause(t){v.pause();pending=Math.max(0,Math.min(DURATION-1/30,t));pauseAfterSeek=true;if(v.readyState>=1){v.currentTime=pending;pending=null}sync()}
v.addEventListener('loadedmetadata',()=>{if(pending!==null){v.currentTime=pending;pending=null;v.pause()}});v.addEventListener('seeked',()=>{if(pauseAfterSeek){v.pause();pauseAfterSeek=false}sync()});['timeupdate','play','pause'].forEach(n=>v.addEventListener(n,sync));q('scrub').oninput=()=>seekPause(Number(q('scrub').value));
function choose(index){const d=DATA[index];selected=index;seekPause(d.seek_time);q('description').textContent=d.text;q('json').textContent=JSON.stringify(d.event,null,2);q('language').href=META.other+'?event='+index;document.querySelectorAll('[data-event]').forEach(e=>e.classList.toggle('active',Number(e.dataset.event)===index));sync()}
function render(){q('events').replaceChildren();q('markers').replaceChildren();const xs=filtered();q('count').textContent=xs.length+' / '+DATA.length+' '+T.events;xs.forEach(d=>{const st=META.subs.find(s=>s.id===d.sub).name;const b=document.createElement('button');b.className='event'+(selected===d.index?' active':'');b.dataset.event=d.index;b.dataset.seekTime=d.seek_time;b.dataset.seekFrame=d.seek_frame;b.style.setProperty('--color',COLORS[d.event.event]);const time=document.createElement('span');time.className='stamp';time.textContent=fmt(d.event.timestamp)+' · ';const tag=document.createElement('span');tag.className='subtag';tag.textContent=st;b.append(time,document.createTextNode(d.text),tag);b.onclick=()=>choose(d.index);q('events').append(b);const m=document.createElement('button');m.className='marker'+(selected===d.index?' active':'');m.dataset.event=d.index;m.dataset.seekTime=d.seek_time;m.dataset.seekFrame=d.seek_frame;m.style.left=(d.event.timestamp/DURATION*100)+'%';m.style.setProperty('--color',COLORS[d.event.event]);m.title=fmt(d.event.timestamp)+' · '+d.text;m.setAttribute('aria-label',d.event.timestamp.toFixed(3)+' s · '+st);m.onclick=()=>choose(d.index);q('markers').append(m)});const head=document.createElement('div');head.id='head';head.className='head';q('markers').append(head);sync()}
q('mainFilter').onchange=()=>{subs();render()};q('subFilter').onchange=render;function mode(raw){const t=v.currentTime;v.pause();v.src=raw?'media/merged_source.mp4':META.video;pending=t;pauseAfterSeek=true;q('clean').classList.toggle('active',raw);q('predicted').classList.toggle('active',!raw)}q('clean').onclick=()=>mode(true);q('predicted').onclick=()=>mode(false);subs();render();const i=new URLSearchParams(location.search).get('event');if(i!==null&&/^\d+$/.test(i)&&Number(i)<DATA.length){const d=DATA[Number(i)];q('mainFilter').value=d.event.event;subs();q('subFilter').value=d.sub;render();choose(Number(i))}
const GALLERY=__GALLERY__;function showSkill(i){const g=GALLERY[i];q('skillTitle').textContent=g.title[META.lang];q('skillCaption').textContent=g.caption[META.lang];q('gtImage').src=g.gt;q('predImage').src=g.prediction;q('gtLink').href=g.gt;q('predLink').href=g.prediction;q('gtImage').alt=g.title[META.lang]+' · '+T.gt_title;q('predImage').alt=g.title[META.lang]+' · '+T.pred_title;document.querySelectorAll('[data-skill]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.skill)===i?'true':'false'))}GALLERY.forEach((g,i)=>{const b=document.createElement('button');b.dataset.skill=i;b.textContent=g.title[META.lang];b.onclick=()=>showSkill(i);q('galleryTabs').append(b)});showSkill(0);
</script></html>
